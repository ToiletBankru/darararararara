<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>SvinMail Mini App</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

    /* светлая тема */
    background: url("background.png") center center / cover no-repeat;
}

/* тёмная тема */
@media (prefers-color-scheme: dark) {
    html, body {
        background: url("background1.png") center center / cover no-repeat;
    }
}

/* контейнер */
.app {
    height: 100vh;
    padding: 24px 16px;
    box-sizing: border-box;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* blur окно */
.glass {
    width: 100%;
    max-width: 390px;
    height: calc(100vh - 48px);

    background: rgba(14, 18, 32, 0.6);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    border-radius: 28px;
    border: 1px solid rgba(255, 255, 255, 0.12);

    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5),
        inset 0 0 0 1px rgba(255, 255, 255, 0.05);

    display: flex;
    flex-direction: column;
}

/* бренд */
.header {
    padding: 24px 0 10px;
    text-align: center;
}

.header h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.6px;
    color: #ffffff;
}

/* приветствие */
.welcome {
    margin-top: 70px;
    text-align: center;
}

.welcome h2 {
    margin: 0;
    font-size: 34px;
    font-weight: 600;
    color: #ffffff;
}

.welcome p {
    margin-top: 10px;
    font-size: 16px;
    color: rgba(255, 255, 255, 0.75);
}

/* кнопка */
.login-btn {
    margin: auto 24px 32px;
    height: 52px;
    border-radius: 14px;
    border: none;

    font-size: 17px;
    font-weight: 600;

    cursor: pointer;
}
</style>
</head>

<body>

<div class="app">
    <div class="glass">

        <div class="header">
            <h1>SvinMail</h1>
        </div>

        <div class="welcome">
            <h2>Hello 👋</h2>
            <p>Log in to enter your email</p>
        </div>

        <button class="login-btn" id="loginBtn">Log in</button>

    </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

function applyTheme() {
    const btn = document.getElementById("loginBtn");
    const theme = tg.themeParams || {};

    btn.style.background = theme.button_color || "#2ea6ff";
    btn.style.color = theme.button_text_color || "#ffffff";
}

applyTheme();

/* обновление при смене темы */
tg.onEvent("themeChanged", applyTheme);

/* обработчик кнопки */
document.getElementById("loginBtn").addEventListener("click", () => {
    tg.showAlert("Log in clicked 🚀");
});
</script>

</body>
</html>
