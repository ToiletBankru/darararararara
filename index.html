<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>SvinMail Mini App</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

    /* СВЕТЛАЯ ТЕМА по умолчанию */
    background: url("background.png") center center / cover no-repeat;
}

/* 🌙 ТЁМНАЯ ТЕМА (iPhone / Android / Telegram) */
@media (prefers-color-scheme: dark) {
    html, body {
        background: url("background1.png") center center / cover no-repeat;
    }
}

/* Контейнер Mini App */
.app {
    height: 100vh;
    padding: 24px 16px;
    box-sizing: border-box;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* Glass окно */
.glass {
    width: 100%;
    max-width: 390px;
    height: calc(100vh - 48px);

    background: rgba(14, 18, 32, 0.6);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    border-radius: 28px;
    border: 1px solid rgba(255, 255, 255, 0.12);

    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5),
        inset 0 0 0 1px rgba(255, 255, 255, 0.05);

    display: flex;
    flex-direction: column;
}

/* Header */
.header {
    padding: 24px 0 20px;
    text-align: center;
}

.header h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.6px;
    color: #ffffff;
}

/* Контент */
.content {
    flex: 1;
}
</style>
</head>

<body>

<div class="app">
    <div class="glass">
        <div class="header">
            <h1>SvinMail</h1>
        </div>

        <div class="content">
            <!-- контент -->
        </div>
    </div>
</div>

</body>
</html>
