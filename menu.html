<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>SvinMail</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: url("background.png") center / cover no-repeat;
}

@media (prefers-color-scheme: dark) {
    html, body {
        background: url("background1.png") center / cover no-repeat;
    }
}

.app {
    height: 100vh;
    padding: 24px 16px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* GLASS */
.glass {
    width: 100%;
    max-width: 390px;
    height: calc(100vh - 48px);
    background: rgba(14, 18, 32, 0.6);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border-radius: 28px;
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow:
        0 20px 60px rgba(0,0,0,0.5),
        inset 0 0 0 1px rgba(255,255,255,0.05);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
}

/* TOP BAR */
.topbar {
    height: 56px;
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.menu {
    font-size: 22px;
    color: #ffffff;
    cursor: pointer;
}

.search {
    font-size: 18px;
    font-weight: 600;
    color: #ffffff;
    opacity: 0.9;
}

.avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    overflow: hidden;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* INBOX */
.inbox-title {
    padding: 12px 18px 6px;
    font-size: 20px;
    font-weight: 700;
    color: #ffffff;
}

.mail-list {
    padding: 0 12px;
}

.mail {
    padding: 14px;
    margin-bottom: 10px;
    background: rgba(255,255,255,0.08);
    border-radius: 14px;
    color: #ffffff;
}

.mail-from {
    font-weight: 600;
    font-size: 15px;
}

.mail-subject {
    font-size: 14px;
    opacity: 0.9;
    margin-top: 4px;
}

.mail-preview {
    font-size: 13px;
    opacity: 0.6;
    margin-top: 2px;
}

/* OVERLAY */
.overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 5;
}

/* SIDEBAR */
.sidebar {
    position: absolute;
    top: 0;
    left: 0;
    width: 240px;
    height: 100%;
    background: rgba(18, 22, 38, 0.75);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border-right: 1px solid rgba(255,255,255,0.12);
    transform: translateX(-100%);
    transition: transform 0.3s ease;
    z-index: 6;
    padding: 24px 16px;
    box-sizing: border-box;
}

.sidebar h3 {
    color: #ffffff;
    margin: 0 0 20px;
    font-size: 20px;
}

.sidebar-item {
    padding: 12px 10px;
    border-radius: 10px;
    color: #ffffff;
    cursor: pointer;
    margin-bottom: 6px;
    opacity: 0.9;
}

.sidebar-item:hover {
    background: rgba(255,255,255,0.08);
}

/* OPEN STATE */
.glass.menu-open .sidebar {
    transform: translateX(0);
}

.glass.menu-open .overlay {
    opacity: 1;
    pointer-events: auto;
}
</style>
</head>

<body>

<div class="app">
    <div class="glass" id="glass">

        <!-- SIDEBAR -->
        <div class="sidebar">
            <h3>SvinMail</h3>
            <div class="sidebar-item">📥 Inbox</div>
            <div class="sidebar-item">⭐ Starred</div>
            <div class="sidebar-item">📤 Sent</div>
            <div class="sidebar-item">🗑 Trash</div>
            <div class="sidebar-item">⚙ Settings</div>
        </div>

        <!-- OVERLAY -->
        <div class="overlay" id="overlay"></div>

        <!-- TOP BAR -->
        <div class="topbar">
            <div class="menu" id="menuBtn">☰</div>
            <div class="search">Search</div>
            <div class="avatar">
                <img id="avatarImg" alt="">
            </div>
        </div>

        <div class="inbox-title">Inbox</div>

        <div class="mail-list">
            <div class="mail">
                <div class="mail-from">SvinMail Team</div>
                <div class="mail-subject">Welcome to SvinMail 🐷📬</div>
                <div class="mail-preview">
                    Your mailbox is ready. Enjoy secure and private email.
                </div>
            </div>
        </div>

    </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

/* AVATAR */
const user = tg.initDataUnsafe?.user;
const avatar = document.getElementById("avatarImg");
if (user && user.photo_url) avatar.src = user.photo_url;

/* MENU */
const glass = document.getElementById("glass");
const menuBtn = document.getElementById("menuBtn");
const overlay = document.getElementById("overlay");

menuBtn.onclick = () => glass.classList.add("menu-open");
overlay.onclick = () => glass.classList.remove("menu-open");
</script>

</body>
</html>
